
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexAi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f4f4f5;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #303038}
.logo{font-size:26px;font-weight:bold;color:#a99bff}
main{max-width:760px;margin:auto;padding:18px}
#status{color:#aaa;font-size:13px}
#chat{min-height:38vh;padding:10px 0}
.msg{background:#202127;padding:14px;border-radius:13px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#302b49}
input{min-width:0;flex:1;padding:13px;border-radius:10px;border:1px solid #444;background:#202127;color:white}
button{padding:12px;border:0;border-radius:10px;background:#a99bff;color:#17151f;font-weight:bold}
form,.tools{display:flex;gap:8px;margin:10px 0}
.tools input{width:100%}
small{color:#aaa}
</style>
</head>
<body>
<header>
  <div class="logo">NexAi</div>
  <small>Русскоязычный ИИ-проект</small>
</header>
<main>
  <p id="status">Подключение к базе знаний...</p>
  <div id="chat">
    <div class="msg">Привет! Я NexAi. Пока подключена база знаний, а языковую модель настроим отдельно.</div>
  </div>
  <form id="askForm">
    <input id="question" placeholder="Введи вопрос..." required>
    <button>Найти</button>
  </form>
  <div class="tools">
    <button id="save">Сохранить вопрос и ответ</button>
  </div>
  <h3>Поиск по базе знаний</h3>
  <form id="searchForm">
    <input id="searchQuery" placeholder="Что найти в базе?" required>
    <button>Искать</button>
  </form>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'sb_secret_Fl_rVSHztjcDQaMpxaw34w_Ld2nkhi9';
const SUPABASE_KEY = 'sb_publishable_oCZinACdnUcajB6yJGnXuA_iTKmEJPf';

const status = document.getElementById('status');
const chat = document.getElementById('chat');
const question = document.getElementById('question');
let currentQuestion = '';
let currentAnswer = '';

function showMessage(text, cls = '') {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  chat.appendChild(el);
}

let db;

try {
  if (SUPABASE_URL.includes('ВСТАВЬ_') ||
      SUPABASE_KEY.includes('ВСТАВЬ_')) {
    throw new Error('Сначала вставь URL и Publishable key.');
  }
  db = createClient(SUPABASE_URL, SUPABASE_KEY);
  const { error } = await db.from('knowledge')
    .select('id').limit(1);
  if (error) throw error;
  status.textContent = 'База знаний подключена.';
} catch (e) {
  status.textContent = 'Ошибка подключения: ' + e.message;
}

document.getElementById('askForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = question.value.trim();
  if (!q || !db) return;

  currentQuestion = q;
  currentAnswer = '';

  showMessage('Ты: ' + q, 'user');

  const { data, error } = await db.from('knowledge')
    .select('question,answer,sources')
    .ilike('question', '%' + q.replace(/[%_]/g, '') + '%')
    .limit(5);

  if (error) {
    currentAnswer = 'Не удалось выполнить поиск.';
    showMessage(currentAnswer);
    return;
  }

  if (data.length) {
    currentAnswer = data.map((item, i) =>
      (i + 1) + '. ' + item.answer +
      '\nИсточники: ' + JSON.stringify(item.sources || [])
    ).join('\n\n');
    showMessage('Найдено в базе:\n' + currentAnswer);
  } else {
    currentAnswer = 'В базе пока нет ответа на этот вопрос. ' +
      'Языковая модель ещё не подключена.';
    showMessage(currentAnswer);
  }
});

document.getElementById('save').addEventListener('click', async () => {
  if (!db || !currentQuestion || !currentAnswer) {
    status.textContent = 'Сначала выполни поиск по вопросу.';
    return;
  }

  const answer = prompt(
    'Проверь ответ и исправь его, если нужно:',
    currentAnswer
  );
  if (answer === null || !answer.trim()) return;

  const { error } = await db.from('knowledge').insert({
    question: currentQuestion,
    answer: answer.trim(),
    sources: []
  });

  status.textContent = error
    ? 'Ошибка сохранения: ' + error.message
    : 'Ответ сохранён в базе знаний.';
});

document.getElementById('searchForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!db) return;

  const q = document.getElementById('searchQuery').value.trim();
  const { data, error } = await db.from('knowledge')
    .select('question,answer,sources,created_at')
    .ilike('question', '%' + q.replace(/[%_]/g, '') + '%')
    .order('created_at', { ascending: false })
    .limit(20);

  if (error) {
    status.textContent = 'Ошибка поиска: ' + error.message;
    return;
  }

  showMessage(data.length
    ? 'Результаты поиска:\n' + data.map(x =>
        'Вопрос: ' + x.question + '\nОтвет: ' + x.answer
      ).join('\n\n')
    : 'По запросу ничего не найдено.');
});
</script>
</body>
</html>
